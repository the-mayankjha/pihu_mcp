[project]
name = "pihu"
version = "0.1.0"
description = "Personalized Intelligent Human Utility (PIHU) Agent Runtime"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "mcp>=1.3.0,<2.0.0",
    "aiosqlite>=0.20.0",
    "google-genai>=0.1.1",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "InquirerPy>=0.3.4",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/pihu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["agent"]
