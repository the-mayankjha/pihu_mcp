[project]
name = "pihu-web-search-mcp"
version = "0.1.0"
description = "Fast, secure, structured Web Search MCP for PIHU"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "trafilatura>=2.0",
    "anyio>=4.4",
]

[project.scripts]
web-search-mcp = "web_search_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
