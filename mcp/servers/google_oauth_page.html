<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>__TITLE__ · PIHU</title>
  <style>
    :root { color-scheme: light dark; --background:#f5f5f5; --surface:rgba(255,255,255,.82); --text:#202020; --muted:#666; --line:rgba(0,0,0,.1); --inset:rgba(0,0,0,.035); }
    @media(prefers-color-scheme:dark) { :root { --background:#141414; --surface:rgba(36,36,36,.82); --text:#f3f3f3; --muted:#aaa; --line:rgba(255,255,255,.12); --inset:rgba(255,255,255,.045); } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:32px 20px; background:var(--background); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:100%; max-width:480px; text-align:center; }
    .brand { display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:28px; }
    .brand img { width:96px; height:104px; object-fit:contain; }
    .wordmark { font-size:16px; font-weight:700; letter-spacing:.38em; padding-left:.38em; }
    .card { padding:36px 28px; border:1px solid var(--line); border-radius:24px; background:var(--surface); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px); box-shadow:0 16px 48px rgba(0,0,0,.08); }
    .service { font-size:12px; letter-spacing:.04em; color:var(--muted); }
    h1 { margin:16px 0; font-size:30px; letter-spacing:-.035em; line-height:1.15; }
    p { color:var(--muted); font-size:15px; line-height:1.65; margin:0; }
    .account { padding:16px; border:1px solid var(--line); background:var(--inset); border-radius:14px; margin:24px 0; overflow-wrap:anywhere; }
    .account strong { display:block; font-size:15px; margin-bottom:4px; }
    .account span { font-size:14px; color:var(--muted); }
    .return { padding-top:24px; margin-top:24px; border-top:1px solid var(--line); font-size:13px; }
    footer { margin-top:28px; color:var(--muted); font-size:12px; }
    [hidden] { display:none!important; }
    @media(max-width:400px) { .card { padding:28px 20px; } h1 { font-size:26px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="__LOGO__" alt="PIHU logo" width="96" height="104"><span class="wordmark">PIHU</span></div>
    <section class="card" aria-labelledby="result-title">
      <div class="service">Google Workspace</div>
      <h1 id="result-title">__TITLE__</h1>
      <p>__MESSAGE__</p>
      <div class="account" __ACCOUNT_HIDDEN__><strong>__ACCOUNT_NAME__</strong><span>__ACCOUNT_EMAIL__</span></div>
      <p class="return">__RETURN__</p>
    </section>
    <footer>Your intelligence. Everywhere.<br>Developed by Mayank Jha</footer>
  </main>
</body>
</html>
