name: Release MCP package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build
        required: true
        type: string
  push:
    tags: ['v*']
concurrency:
  group: mcp-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIHU_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Check version matches tag
        shell: bash
        run: python -c "import json,os; assert 'v'+json.load(open('manifest.json'))['version'] == os.environ['PIHU_RELEASE_TAG'], 'Tag does not match manifest version'"
      - name: Build package and dependencies
        run: python tools/build_release.py --repository ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare registry manifest
        run: python tools/publish_release.py --artifacts dist --prepare-only
      - name: Upload release files
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing immutable release retained.'
            echo 'reused=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" dist/*.zip dist/*.json --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
      - name: Register package through pihu_web API
        if: steps.release.outputs.reused != 'true'
        env:
          MARKET_PUBLISH_TOKEN: ${{ secrets.MARKET_PUBLISH_TOKEN }}
        run: python tools/publish_release.py --artifacts dist
